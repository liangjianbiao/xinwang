<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="55%" stop-color="#FFE9F3"/>
      <stop offset="100%" stop-color="#E3F4FF"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#8ED6FF"/>
      <stop offset="100%" stop-color="#2E86D6"/>
    </radialGradient>
    <filter id="sh5" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2a4a7a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="18" fill="url(#bg5)"/>
  <!-- 迷宫墙 -->
  <g fill="none" stroke="#B9A7D9" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M96 84 H304 M96 84 V216 M304 84 V140 M96 216 H220"/>
    <path d="M150 84 V140 M150 140 H250 M250 140 V216 M220 216 H304 M304 140 V216"/>
  </g>
