  <path d="M272 180 l6 13 14 2 -10 10 2 14 -12-7 -12 7 2-14 -10-10 14-2z" fill="#FFD93D" stroke="#fff" stroke-width="2.5"/>
  <!-- 动感小球（笑脸） -->
  <g transform="translate(122,182)" filter="url(#sh5)">
    <circle r="26" fill="url(#ball)" stroke="#fff" stroke-width="4"/>
    <circle cx="-8" cy="-4" r="3.4" fill="#123a5a"/>
    <circle cx="8" cy="-4" r="3.4" fill="#123a5a"/>
    <path d="M-7 6 Q0 12 7 6" fill="none" stroke="#123a5a" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="-13" cy="3" r="4" fill="#FF9D9D" opacity="0.5"/>
    <circle cx="13" cy="3" r="4" fill="#FF9D9D" opacity="0.5"/>
  </g>
  <!-- 运动轨迹 -->
  <path d="M84 232 q40 -34 38 -50" fill="none" stroke="#4FC3F7" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>
