<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6E0"/>
      <stop offset="55%" stop-color="#FFE9F3"/>
      <stop offset="100%" stop-color="#E3F4FF"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B98CFF"/>
      <stop offset="100%" stop-color="#7C4DCC"/>
    </linearGradient>
    <linearGradient id="towerDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B6BF0"/>
      <stop offset="100%" stop-color="#6A3CB8"/>
    </linearGradient>
    <filter id="sh7" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#4a2a8a" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="18" fill="url(#bg7)"/>
  <g fill="#FFD93D" opacity="0.8">
    <path d="M60 64 l3 7 8 1 -6 5.5 1.5 8 -6.5-4 -6.5 4 1.5-8 -6-5.5 8-1z"/>
    <circle cx="338" cy="74" r="5"/>
  </g>
  <g filter="url(#sh7)">
    <!-- 两侧塔楼 -->
    <rect x="96" y="120" width="62" height="120" rx="8" fill="url(#towerDark)" stroke="#fff" stroke-width="4"/>
    <rect x="242" y="120" width="62" height="120" rx="8" fill="url(#towerDark)" stroke="#fff" stroke-width="4"/>
    <!-- 城垛 -->
    <g fill="url(#towerDark)" stroke="#fff" stroke-width="4">
      <rect x="96" y="106" width="14" height="18"/><rect x="120" y="106" width="14" height="18"/><rect x="144" y="106" width="14" height="18"/>
      <rect x="242" y="106" width="14" height="18"/><rect x="266" y="106" width="14" height="18"/><rect x="290" y="106" width="14" height="18"/>
    </g>
    <!-- 主塔 -->
    <rect x="164" y="86" width="72" height="154" rx="8" fill="url(#tower)" stroke="#fff" stroke-width="4"/>
    <path d="M160 90 L200 52 L240 90 Z" fill="#E85A8A" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <!-- 尖顶旗 -->
    <line x1="200" y1="52" x2="200" y2="34" stroke="#6A3CB8" stroke-width="4" stroke-linecap="round"/>
    <path d="M200 34 L224 41 L200 49 Z" fill="#FFD93D"/>
    <!-- 门 -->
    <path d="M186 240 v-30 a14 14 0 0 1 28 0 v30 z" fill="#4A2A7A"/>
    <!-- 窗户 -->
    <g fill="#FFF3C4">
      <rect x="116" y="150" width="22" height="28" rx="10"/>
      <rect x="262" y="150" width="22" height="28" rx="10"/>
      <rect x="189" y="128" width="22" height="28" rx="10"/>
    </g>
    <!-- 砖纹 -->
    <g stroke="#fff" stroke-width="2.5" opacity="0.35">
      <line x1="96" y1="190" x2="158" y2="190"/>
      <line x1="242" y1="190" x2="304" y2="190"/>
      <line x1="164" y1="176" x2="236" y2="176"/>
      <line x1="164" y1="210" x2="236" y2="210"/>
    </g>
  </g>
  <!-- 小星星点缀 -->
  <path d="M200 150 l5 11 12 2 -9 8 2 12 -10-6 -10 6 2-12 -9-8 12-2z" fill="#FFD93D" opacity="0.95"/>
</svg>
