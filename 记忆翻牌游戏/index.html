<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>记忆翻牌游戏</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
    var _hmt = _hmt || [];
    (function() {
      var hm = document.createElement("script");
      hm.src = "https://hm.baidu.com/hm.js?e4b1cad1dc884ec2ee26027d50258d86";
      var s = document.getElementsByTagName("script")[0];
      s.parentNode.insertBefore(hm, s);
    })();
    </script>
</head>
<body>
    <div class="background-animation"></div>
    
    <div class="game-container">
        <header class="game-header">
            <button id="btn-back" class="btn btn-back">
                <i class="fas fa-arrow-left"></i> 返回
            </button>
            <div class="header-title">
                <h1>🧠 记忆翻牌</h1>
                <p class="subtitle">锻炼记忆力，挑战最高分</p>
            </div>
            <button id="btn-restart" class="btn btn-restart">
                <i class="fas fa-redo"></i> 重开
            </button>
        </header>

        <div class="game-info-bar">
            <div class="info-item">
                <span class="info-icon">⏱️</span>
                <div class="info-content">
                    <span class="info-label">时间</span>
                    <span class="info-value" id="timer">00:00</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">👣</span>
                <div class="info-content">
                    <span class="info-label">步数</span>
                    <span class="info-value" id="moves">0</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">🎯</span>
                <div class="info-content">
                    <span class="info-label">配对</span>
                    <span class="info-value" id="matches">0/<span id="total-matches">8</span></span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">⭐</span>
                <div class="info-content">
                    <span class="info-label">星级</span>
                    <span class="info-value" id="stars">⭐⭐⭐</span>
                </div>
            </div>
            <div class="info-item">
                <span class="info-icon">🏆</span>
                <div class="info-content">
                    <span class="info-label">得分</span>
                    <span class="info-value" id="score">0</span>
                </div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">0%</span>
        </div>

        <main class="game-board">
            <div class="cards-grid" id="cards-grid">
            </div>
            <div class="loading-overlay" id="loading-overlay">
                <div class="loading-spinner"></div>
                <p>正在准备卡片...</p>
            </div>
        </main>

        <div class="game-controls">
            <div class="difficulty-select">
                <span class="difficulty-label">难度：</span>
                <button class="difficulty-btn active" data-level="easy">
                    <span class="diff-icon">🌱</span> 简单
                </button>
                <button class="difficulty-btn" data-level="medium">
                    <span class="diff-icon">🌿</span> 中等
                </button>
                <button class="difficulty-btn" data-level="hard">
                    <span class="diff-icon">🌳</span> 困难
                </button>
            </div>
            <button id="btn-hint" class="btn btn-hint">
                <i class="fas fa-lightbulb"></i> 提示 (<span id="hint-count">3</span>)
            </button>
        </div>

        <div class="achievements-bar" id="achievements-bar">
            <div class="achievement-item" id="achievement-speed" title="闪电手：30秒内完成">
                <span class="achievement-icon">⚡</span>
                <span class="achievement-name">闪电手</span>
            </div>
            <div class="achievement-item" id="achievement-perfect" title="完美配对：用最少步数完成">
                <span class="achievement-icon">💎</span>
                <span class="achievement-name">完美配对</span>
            </div>
            <div class="achievement-item" id="achievement-master" title="记忆大师：完成所有难度">
                <span class="achievement-icon">👑</span>
                <span class="achievement-name">记忆大师</span>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content">
            <div class="modal-icon" id="modal-icon">🎉</div>
            <h2 class="modal-title" id="modal-title">恭喜完成！</h2>
            <div class="modal-stats">
                <div class="stat-row">
                    <span>用时：</span>
                    <span id="result-time">00:00</span>
                </div>
                <div class="stat-row">
                    <span>步数：</span>
                    <span id="result-moves">0</span>
                </div>
                <div class="stat-row">
                    <span>星级：</span>
                    <span id="result-stars">⭐⭐⭐</span>
                </div>
                <div class="stat-row highlight">
                    <span>得分：</span>
                    <span id="result-score">0</span>
                </div>
                <div class="stat-row">
                    <span>最佳记录：</span>
                    <span id="best-record">--</span>
                </div>
            </div>
            <div class="new-record-badge" id="new-record-badge" style="display: none;">
                🏆 新纪录！
            </div>
            <div class="modal-buttons">
                <button id="btn-play-again" class="btn btn-primary">再玩一次</button>
                <button id="btn-home" class="btn btn-secondary">返回首页</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
